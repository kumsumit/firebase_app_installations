name: firebase_app_installations
description: A Flutter plugin allowing you to use Firebase Installations.
version: 0.4.3
publish_to: none
homepage: https://firebase.google.com/docs/projects/manage-installations#flutter
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_app_installations/firebase_app_installations
topics:
  - firebase
  - installations
  - app
  - identity

false_secrets:
  - example/**

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

dependencies:
  firebase_app_installations_platform_interface: 
    git: https://github.com/kumsumit/firebase_app_installations_platform_interface.git
  firebase_app_installations_web: 
    git: https://github.com/kumsumit/firebase_app_installations_web.git
  firebase_core: 
    git: https://github.com/kumsumit/firebase_core.git
  firebase_core_platform_interface: 
    git: https://github.com/kumsumit/firebase_core_platform_interface.git
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  plugin_platform_interface: 
    git: https://github.com/kumsumit/plugin_platform_interface.git

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.installations.firebase_app_installations
        pluginClass: FirebaseInstallationsPlugin
      ios:
        pluginClass: FirebaseInstallationsPlugin
      macos:
        pluginClass: FirebaseInstallationsPlugin
